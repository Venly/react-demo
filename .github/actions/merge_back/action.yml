name: "Merge Back to Development"
description: "Merge branch back to develop"
inputs:
  branch:
    description: The branch to Merge
    required: true
  token:
    description: GitHub token for authentication
    required: true
  work_directory:
    description: "Optional working directory containing package.json"
    required: false
runs:
  using: "composite"
  steps:
    - name: Branch to Build
      shell: bash
      run: echo -e "🔧 Merging ${{ github.sha }} back to develop  🔧"

    - uses: oleksiyrudenko/gha-git-credentials@v2.1.1
      with:
        global: false
        name: ${{ github.actor }}
        email: ${{ github.actor }}@venly.io
        actor: ${{ github.actor }}
        token: ${{ inputs.token }}

    - name: Merge back to develop
      env:
        GIT_USERNAME: ${{ github.actor }}
        GITHUB_TOKEN: ${{ inputs.token }}
      shell: bash
      run: |
        #!/bin/bash
        set -x

        PACKAGE_DIR="${{ inputs.work_directory }}"
        if [ -z "$PACKAGE_DIR" ]; then
          PACKAGE_DIR="."
        fi

        git fetch -p --unshallow
        git reset --hard
        git checkout ${{ github.sha }}
        if [ -f "$PACKAGE_DIR/package.json" ]; then
          # Read branch version
          BRANCH_VERSION=$(jq -r '.version' "$PACKAGE_DIR/package.json")

          # Fetch develop branch and checkout
          git fetch --no-tags origin develop:develop
          git checkout develop

          # Read develop version
          DEVELOP_VERSION=$(jq -r '.version' "$PACKAGE_DIR/package.json")

          # Update develop to branch version
          (cd "$PACKAGE_DIR" && npm version $BRANCH_VERSION --git-tag-version=false)
          git commit -am "Update develop to branch version to avoid merge conflicts"

          # Merge current commit into develop
          git merge ${{ github.sha }}

          # Restore develop version
          (cd "$PACKAGE_DIR" && npm version $DEVELOP_VERSION --git-tag-version=false)
          git commit -am "Update develop version back to pre-merge state"
        else
          # If not a Node.js project, just merge
          git fetch --no-tags origin develop:develop
          git checkout develop
          git merge ${{ github.sha }}
        fi

        # Push changes back to develop branch
        git push origin develop:develop
